name: Windows

# Un tag v* costruisce l'installer per Windows e lo carica nella release del tag, dove electron-updater lo trova.
# Avviato a mano, costruisce soltanto e lascia l'installer tra gli artifact del run, per provarlo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm run backend
      - run: npm run codex
      - name: Prova del servizio impacchettato
        # Il servizio congelato deve partire, rispondere, trovare il Codex incluso e fare da server degli strumenti.
        shell: bash
        env:
          ASSISTENTE_CODEX: ${{ github.workspace }}\vendor\codex\codex.exe
          ASSISTENTE_DATI: ${{ runner.temp }}\dati
        run: |
          "$ASSISTENTE_CODEX" --version
          vendor/backend/assistente.exe --porta 8390 --non-aprire > servizio.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8390/api/stato > stato.json && break; sleep 2; done
          cat servizio.log stato.json
          grep -q '"testo": "Not logged in"' stato.json
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | vendor/backend/assistente.exe strumenti-foto backend/statico/sorridi-chiaro.png | grep -q serverInfo
          kill %1 || true
      - name: Installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/latest.yml
